name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish framework-dependent build
        run: dotnet publish iTu/iTu.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -p:DebugType=none -o dist/iTu

      - name: Publish self-contained build
        run: dotnet publish iTu/iTu.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=none -o dist/iTu-standalone

      - name: Rename release assets
        shell: bash
        run: |
          mv dist/iTu/iTu.exe "dist/iTu-${GITHUB_REF_NAME}-win-x64.exe"
          mv dist/iTu-standalone/iTu.exe "dist/iTu-${GITHUB_REF_NAME}-standalone-win-x64.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: iTu ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 下载

            | 版本 | 文件 | 说明 |
            |---|---|---|
            | 独立版（推荐） | `iTu-${{ github.ref_name }}-standalone-win-x64.exe` | 内含 .NET 10 运行时，Windows 10/11 双击即用 |
            | 轻量版 | `iTu-${{ github.ref_name }}-win-x64.exe` | 约 0.5 MB，需系统已安装 .NET 10 Desktop Runtime |

            两个版本都是单文件，OCR 脚本已内嵌，无需附带其他文件。
          files: |
            dist/iTu-${{ github.ref_name }}-win-x64.exe
            dist/iTu-${{ github.ref_name }}-standalone-win-x64.exe
